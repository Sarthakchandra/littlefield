# Littlefield bot settings. Edit on GitHub and commit; the next run picks it up.

dry_run: false            # true = log decisions, change nothing
allow_loans: true         # borrow (20%/yr + 5% fee) to fund fast-payback capacity
stop_after_day: 299.95     # final sell-down happens at 299.5+

# hard limits, applied after the policy
max_spend_per_run: 600000
max_buy_per_station_per_run: 8
max_sell_per_run: 40        # end-of-game sell-down happens in one or two runs

# notifications (GitHub issue comment -> email; WhatsApp if WA_PHONE/WA_APIKEY secrets exist)
notify_on: all            # all = every change; major = skip kit reorder tweaks
notify_owner: Sarthakchandra

# policy knobs (defaults in lf/policy.py, tuned on the digital twin)
policy:
  util_target: 0.85       # planned machine utilisation at forecast demand
  flush_days: 6           # clear the day-50 backlog over ~6 days
  wip_days: 0.6           # WIP cap = throughput x 0.6 day -> lead time < 1 day
  max_debt: 1800000       # raised day 78: stuffers maxed, ~15 orders/day turned away
  safety_days: 1.0        # kit safety stock
  rule: pri4              # tester priority: fifo | pri2 | pri4
  sell_mode: final         # stop accepting at 299.3, sell down to 1 per station once WIP is 0
  c2_revert_lt: 1.5        # c2 pays $750 at 1.5 days: below that c1 is better
  c3_mode: true           # split each order into 3 lots of 20 and run contract 3 ($1,500, 6h quote)
  target_lots: 3          # flow ~5.2h at lot 20; lot 12 needs too much capital
  c3_wip_days: 0.235      # safe WIP cap: capacity x 0.235 day (cap 14 with 20 stuffers)
  # c3_wip_days_probe removed day 156: cap 16 cycled with cap 14 every ~5 days and averaged
  # $33.3k/day margin (price $1,297) against $34.8k (price $1,350) at a fixed cap of 14
  c3_min_rev: 1300        # break-even: +4 jobs x $760 = a $61/job price drop on 50 jobs
  buy_min_util: 0.80      # day 108: no new machine at a station under 80% busy (2-day avg); S1 sat at 70%
  buy_gate_from_day: 105  # gate off during the ramp-up: machines must land before demand does
  kit_end_flat: true      # day 237: plan the last kit orders on the live order rate, not last year's fall to zero
  kit_end_flat_always: true # demand steps down at ~250 then holds: +$70k vs curve, at most -$20k if it keeps falling
  max_machines: 40
  no_edit_mode: hold      # if contract/WIP never become editable: stop buying kits, keep cash
  hold_after_day: 55
